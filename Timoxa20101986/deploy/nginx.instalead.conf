# Rendered by deploy.ps1: __DOMAIN__ and __SERVER_IP__ are substituted before
# install. Both names are listed on purpose — the domain's DNS often keeps
# pointing at the previous server for a while, and without the IP the site is
# simply unreachable in the meantime rather than "not yet".
#
# For a manual install, substitute them yourself:
#   sed "s|__DOMAIN__|example.com|g; s|__SERVER_IP__|203.0.113.10|g" \
#     deploy/nginx.instalead.conf | sudo tee /etc/nginx/sites-available/instalead

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__ __SERVER_IP__;

    root /var/www/instalead/frontend/dist;
    index index.html;

    client_max_body_size 10m;

    location /api/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The extension's enrichment pass writes notes during a single request,
        # and a slow model call can outlast the client default.
        proxy_read_timeout 180s;
    }

    location /health {
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets never change under the same name; index.html must
    # never be cached or clients keep loading an old bundle after a deploy.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }
}