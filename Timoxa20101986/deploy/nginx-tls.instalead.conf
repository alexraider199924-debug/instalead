# TLS-блок для instalead. Ставится deploy.ps1 только когда сертификат уже
# выпущен (/etc/letsencrypt/live/<домен>/fullchain.pem существует).
#
# Отдельный файл, а не второй блок в основном конфиге: nginx не стартует, если
# в конфиге есть listen 443 ssl, а сертификата ещё нет. На первом деплое
# certbot ещё не выпустил его, и весь сайт лёг бы — ровно то, что произошло,
# когда основной конфиг без этого блока перезаписал конфиг с работающим TLS.
#
# Ручная установка:
#   sed "s|__DOMAIN__|example.com|g" deploy/nginx-tls.instalead.conf \
#     | sudo tee /etc/nginx/sites-available/instalead-tls
#   sudo ln -sf /etc/nginx/sites-available/instalead-tls /etc/nginx/sites-enabled/instalead-tls

# http2 пишется в самом listen, а не отдельной директивой `http2 on;`:
# отдельная директива появилась только в nginx 1.25, а Ubuntu 24.04 ставит
# 1.24 — с ней nginx не стартует вовсе.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __DOMAIN__ www.__DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/instalead/frontend/dist;
    index index.html;

    client_max_body_size 10m;

    location /api/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }

    location /health {
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }
}